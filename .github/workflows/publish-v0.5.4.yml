name: Publish Micro-Pandora 0.5.4
on:
  push:
    branches: [release-v0.5.4]
    paths: [.github/workflows/publish-v0.5.4.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: 8733ecf6837a761e27721ddd3d3486c6e2f86af6
    steps:
      - name: Package and publish the verified commit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --no-checkout "https://github.com/$GH_REPO.git" source
          test "$(git -C source show "$TARGET:manifest.json" | jq -r .version)" = 0.5.4
          git -C source archive --format=tar --prefix=Micro-Pandora-0.5.4/ "$TARGET" | gzip -n > Micro-Pandora-0.5.4.tar.gz
          sha256sum Micro-Pandora-0.5.4.tar.gz > SHA256SUMS
          cat > notes.md <<'NOTES'
          Keep the soft album silhouette visible across an Omarchy reload. The original cover fades into a high-resolution blur at a steady opacity.
          
          This release includes the expanded album palette, the softer backdrop, and the level Orbit visualizer with balanced motion.
          
          Right-click the music note to open the full player. Extract the archive and run `./scripts/setup.sh` to install.
          NOTES
          gh release create v0.5.4 Micro-Pandora-0.5.4.tar.gz SHA256SUMS --target "$TARGET" --title 'Micro-Pandora 0.5.4' --notes-file notes.md --latest

name: Publish Micro-Pandora 0.5.7
on:
  push:
    branches: [release-v0.5.7]
    paths: [.github/workflows/publish-v0.5.7.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: 10e6ba0335d20946757793f655538496e7d4040a
    steps:
      - name: Package and publish the verified commit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --no-checkout "https://github.com/$GH_REPO.git" source
          test "$(git -C source show "$TARGET:manifest.json" | jq -r .version)" = 0.5.7
          git -C source archive --format=tar --prefix=Micro-Pandora-0.5.7/ "$TARGET" | gzip -n > Micro-Pandora-0.5.7.tar.gz
          sha256sum Micro-Pandora-0.5.7.tar.gz > SHA256SUMS
          cat > notes.md <<'NOTES'
          Frame the entire original album cover behind the full player. Hold the artwork steady and replace it only when the next cover has loaded.
          
          Right-click the music note to open the full player. Extract the archive and run `./scripts/setup.sh` to install.
          NOTES
          gh release create v0.5.7 Micro-Pandora-0.5.7.tar.gz SHA256SUMS --target "$TARGET" --title 'Micro-Pandora 0.5.7' --notes-file notes.md --latest

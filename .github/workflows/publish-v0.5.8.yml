name: Publish Micro-Pandora 0.5.8
on:
  push:
    branches: [release-v0.5.8]
    paths: [.github/workflows/publish-v0.5.8.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: 14f826307e41b9b4595d9344eded1c8c896cc95a
    steps:
      - name: Package and publish the verified commit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --no-checkout "https://github.com/$GH_REPO.git" source
          test "$(git -C source show "$TARGET:manifest.json" | jq -r .version)" = 0.5.8
          git -C source archive --format=tar --prefix=Micro-Pandora-0.5.8/ "$TARGET" | gzip -n > Micro-Pandora-0.5.8.tar.gz
          sha256sum Micro-Pandora-0.5.8.tar.gz > SHA256SUMS
          cat > notes.md <<'NOTES'
          Restore the softened album artwork that fills the full player. Keep the backdrop visible while loading the next cover.
          
          Right-click the music note to open the full player. Extract the archive and run `./scripts/setup.sh` to install.
          NOTES
          gh release create v0.5.8 Micro-Pandora-0.5.8.tar.gz SHA256SUMS --target "$TARGET" --title 'Micro-Pandora 0.5.8' --notes-file notes.md --latest

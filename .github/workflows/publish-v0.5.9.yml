name: Publish Micro-Pandora 0.5.9
on:
  push:
    branches: [release-v0.5.9]
    paths: [.github/workflows/publish-v0.5.9.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: 56343d2d1c71f10a6cf54b1e1199e6688dd7f893
    steps:
      - name: Package and publish the verified commit
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --no-checkout "https://github.com/$GH_REPO.git" source
          test "$(git -C source show "$TARGET:manifest.json" | jq -r .version)" = 0.5.9
          git -C source archive --format=tar --prefix=Micro-Pandora-0.5.9/ "$TARGET" | gzip -n > Micro-Pandora-0.5.9.tar.gz
          sha256sum Micro-Pandora-0.5.9.tar.gz > SHA256SUMS
          cat > notes.md <<'NOTES'
          Lighten the full-player album backdrop blur so features and outlines read more clearly.
          
          Right-click the music note to open the full player. Extract the archive and run `./scripts/setup.sh` to install.
          NOTES
          gh release create v0.5.9 Micro-Pandora-0.5.9.tar.gz SHA256SUMS --target "$TARGET" --title 'Micro-Pandora 0.5.9' --notes-file notes.md --latest
